[base]
package = ocean
env_name = puffer_crystalboard
policy_name = Crystalboard30x30

[env]
board_size = 30
num_envs = 1
max_steps = 10
frameskip = 20

[policy]
framestack = 1
flat_size = 1920
embed_dim = 128
num_heads = 4
ff_dim = 256
num_layers = 2
dropout = 0.1
hidden_size = 256

[train]
total_timesteps = 10_000_000
learning_rate = 0.001
minibatch_size = 64

[sweep]
goal = maximize
metric = episode_return
