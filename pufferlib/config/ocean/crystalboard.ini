[base]
package = ocean
env_name = puffer_crystalboard
policy_name = CrystalboardUNet

[env]
board_size = 30
num_envs = 16
max_steps = 200
frameskip = 20

[policy]
embed_dim = 64
board_size = 30

[train]
total_timesteps = 10_000_000
learning_rate = 0.002
minibatch_size = 512
checkpoint_interval = 10

[sweep]
goal = maximize
metric = episode_return
