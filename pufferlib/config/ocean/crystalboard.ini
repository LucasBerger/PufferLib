[base]
package = ocean
env_name = puffer_crystalboard
policy_name = Crystalboard30x30

[env]
board_size = 30
num_envs = 512
max_steps = 200
frameskip = 20

[policy]
framestack = 1
flat_size = 1920
embed_dim = 128
num_heads = 4
ff_dim = 256
num_layers = 2
dropout = 0.1
hidden_size = 256

[train]
total_timesteps = 100_000_000
learning_rate = 0.0005
minibatch_size = 512
checkpoint_interval = 10

[sweep]
goal = maximize
metric = episode_return
