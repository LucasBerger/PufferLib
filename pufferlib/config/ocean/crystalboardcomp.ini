[base]
package = ocean
env_name = puffer_crystalboardcomp
policy_name = CrystalboardCompUNet

[env]
board_size = 30
num_envs = 1
max_steps = 500
frameskip = 20

[vec]
num_envs = 8

[policy]
embed_dim = 64
board_size = 30

[train]
total_timesteps = 10_000_000
learning_rate = 0.002
minibatch_size = 1024
checkpoint_interval = 10

[sweep]
goal = maximize
metric = episode_return
