[base]
package = ocean
env_name = puffer_rymdboard
policy_name = Rymdboard

[env]
num_envs = 128
max_steps = 50
frameskip = 20

[policy]
framestack = 1
flat_size = 1920
embed_dim = 128
num_heads = 4
ff_dim = 256
num_layers = 3
dropout = 0.1
hidden_size = 256

[train]
total_timesteps = 100_000
learning_rate = 0.001872697444170167
gamma = 0.7999999999999999
minibatch_size = 256
ent_coef = 0.001944252494228687
batch_size = auto
adam_beta1 = 0.9665594472062970
adam_beta2 = 0.9735558377186513
adam_eps = 1e-10
anneal_lr = 1
bptt_horizon = 32
checkpoint_interval = 200
clip_coef = 0.2
compile = 0
compile_fullgraph = 1
compile_mode = max-autotune-no-cudagraphs
cpu_offload = 0
gae_lambda = 0.9308668146678523
max_grad_norm = 1.906758780964323
max_minibatch_size = 32768
min_lr_ratio = 0.21932009330494
prio_alpha = 0.6639173518782286
prio_beta0 = 0.8779327437651407
vf_coef = 3.752131101947459
vf_clip_coef = 1.5
vtrace_c_clip = 1.9104572785632237
vtrace_rho_clip = 2.2007484608931227


[sweep]
goal = maximize
metric = episode_return

[sweep.train.learning_rate]
distribution = log_normal
min = 1e-4
max = 1e-2

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 128
max = 1024

[sweep.train.total_timesteps]
distribution = uniform
min = 2_000_000
max = 10_000_000
mean = 6_000_000
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 0.5
max = 3.0
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 0.5
max = 3.0
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 2.0
max = 5.0
scale = auto


[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.01
max = 1.5
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.8
max = 0.995
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.2
max = 1.0
scale = auto

[sweep.train.adam_eps]
distribution = log_normal
min = 1e-14
max = 1e-10
scale = auto