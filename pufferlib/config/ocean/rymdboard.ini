[base]
package = ocean
env_name = puffer_rymdboard
policy_name = RymdboardHybridPolicy

[env]
num_envs = 128
max_steps = 50
frameskip = 20

[policy]
framestack = 1
flat_size = 1920
embed_dim = 128
num_heads = 4
ff_dim = 256
num_layers = 2
dropout = 0.1
hidden_size = 256

[train]
total_timesteps = 10_000_000
learning_rate = 0.001
minibatch_size = 256

[sweep]
goal = maximize
metric = episode_return
